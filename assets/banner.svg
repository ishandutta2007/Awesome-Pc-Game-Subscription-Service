<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#24243e" />
      <stop offset="100%" stop-color="#302b63" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .subtitle {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #00c6ff;
      letter-spacing: 0.5px;
    }
    .tagline {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #a0aec0;
    }

    /* Dynamic CSS animations for background decorative elements */
    @keyframes float1 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -20px) scale(1.08); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes float2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-25px, 25px) scale(0.95); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }

    .bg-element-1 { animation: float1 8s ease-in-out infinite; }
    .bg-element-2 { animation: float2 10s ease-in-out infinite; }
    .pulse-glow { animation: pulse 4s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16" />

  <!-- Background Animated Dynamic Elements (BEHIND Text) -->
  <g class="bg-element-1">
    <circle cx="150" cy="80" r="120" fill="#7928ca" opacity="0.25" filter="url(#glow)" />
    <rect x="950" y="40" width="180" height="180" rx="30" fill="url(#pillGrad)" opacity="0.2" filter="url(#glow)" transform="rotate(25 1040 130)" />
  </g>

  <g class="bg-element-2">
    <circle cx="1050" cy="260" r="140" fill="#00c6ff" opacity="0.2" filter="url(#glow)" />
    <rect x="80" y="200" width="220" height="80" rx="40" fill="#ff007f" opacity="0.15" filter="url(#glow)" transform="rotate(-15 190 240)" />
  </g>

  <g class="pulse-glow">
    <!-- Grid overlay effect -->
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    <path d="M 200,0 L 200,340 M 400,0 L 400,340 M 600,0 L 600,340 M 800,0 L 800,340 M 1000,0 L 1000,340" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  </g>

  <!-- FOREGROUND CONTENT (Always on top and completely legible) -->
  <!-- Decorative Controller Icon SVG -->
  <g transform="translate(100, 105)">
    <rect x="0" y="0" width="110" height="110" rx="24" fill="url(#pillGrad)" />
    <!-- Gamepad SVG outline -->
    <path d="M 35,42 C 30,42 25,47 25,55 C 25,68 32,80 40,80 C 44,80 48,75 52,70 L 58,70 C 62,75 66,80 70,80 C 78,80 85,68 85,55 C 85,47 80,42 75,42 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
    <path d="M 37,55 L 47,55 M 42,50 L 42,60" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="68" cy="52" r="3" fill="#ffffff" />
    <circle cx="75" cy="58" r="3" fill="#ffffff" />
  </g>

  <!-- Text Header -->
  <text x="240" y="135" class="title">Awesome PC Game Subscription Service 🎮</text>
  <text x="240" y="175" class="subtitle">Cloud Gaming • Subscription Catalogs • Self-Hosted Streaming Stacks</text>
  <text x="240" y="212" class="tagline">A comprehensive curated guide comparing commercial game subscriptions and open-source game servers.</text>

  <!-- Feature Badges / Pills (Foreground) -->
  <g transform="translate(240, 235)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#00c6ff" stroke-width="1" />
    <text x="75" y="21" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ SaaS Platforms</text>

    <!-- Pill 2 -->
    <rect x="162" y="0" width="170" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#00c6ff" stroke-width="1" />
    <text x="247" y="21" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 Open-Source Stacks</text>

    <!-- Pill 3 -->
    <rect x="344" y="0" width="160" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#00c6ff" stroke-width="1" />
    <text x="424" y="21" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">🌐 Cloud &amp; Self-Hosted</text>
  </g>

</svg>
